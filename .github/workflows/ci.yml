name: Build

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build + test
        run: >
          mvn -B -ntp clean test package
          -Dbuild.number=${{ github.run_number }}
          -Dbuild.suffix=-build.${{ github.run_number }}

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: |
            target/*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
            !target/original-*.jar