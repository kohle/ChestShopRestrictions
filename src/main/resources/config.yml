# ChestShopRestrictions Configuration
# This plugin adds restrictions to ChestShop, such as minimum price limits and maximum shop limits.

# Database configuration for shop tracking.
# Supported types: sqlite, mysql
database:
  type: sqlite

  # Table prefix for database tables
  table-prefix: csr_

  # SQLite configuration (used when type is "sqlite")
  sqlite:
    file: shops.db

  # MySQL configuration (used when type is "mysql")
  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: root
    password: ""
    use-ssl: false

# Minimum global prices for chest shops.
# These follow ChestShop's sign format (customer perspective):
#   buy  = the B price on the sign (what a customer pays to buy from the shop)
#   sell = the S price on the sign (what a customer receives when selling to the shop)
# This will OVERRIDE any settings in the ChestShop priceLimits.yml file.
# Set to 0 to disable minimum price limits.
minimum-prices:
  buy: 1
  sell: 1

# Allow shops with a "free" price (0).
# When true, shops set to "free" will skip the minimum-price check.
# When false, free shops are treated as price 0 and rejected if the minimum is > 0.
allow-free-shops: true

# Require whole numbers for prices (no decimals).
whole-numbers-only: true

# Enable or disable the maximum shop limit feature.
# When enabled, players are limited by the chestshoprestrictions.maxshops.<number> permission.
max-shops-enabled: false

# Block transactions at shops owned by players who are over their shop limit.
# When enabled, buyers will be notified and the transaction will be cancelled.
# The shop owner will also be notified when they log in.
block-transactions-over-limit: false

# Messages sent to players (MiniMessage format).
# Use tags like <red>, <bold>, <gradient:red:blue>, etc.
# Set a message to "" to disable it.
messages:

  # Error messages shown when a player tries to create a shop with a price below the minimum.
  # Available placeholders:
  #   <price>     - the minimum price value
  #   <currency>  - the currency name (auto singular/plural via Vault)
  minimum-prices:
    buy: "<red>The minimum buy (B) price is <price> <currency>."
    sell: "<red>The minimum sell (S) price is <price> <currency>."

  # Error message shown when a player tries to create a shop with a non-whole number price.
  whole-numbers-only: "<red>The price must be a whole number."

  # Error message shown when a player has reached their maximum number of shops.
  # Available placeholders:
  #   <max> - the player's max shop limit
  max-shops: "<red>You have reached the maximum number of shops (<max>)."

  # Message shown with /csr count [player].
  # Available placeholders:
  #   <player> - the target player's name
  #   <count>  - current shop count
  #   <max>    - max shop limit (or ∞ if unlimited)
  count: "<gold><player>'s shop count: <yellow><count>/<max>"

  # Message shown to buyers when a transaction is blocked because the shop owner is over their limit.
  transaction-blocked: "<red>This shop is currently disabled because the owner has too many shops."

  # Message shown to shop owners when they log in and are over their shop limit.
  # Available placeholders:
  #   <count> - current shop count
  #   <max>   - max shop limit
  over-limit-login: "<red>You have <count> shops but are only allowed <max>. Your shops are disabled until you remove some."

  # Limits message shown with /csq limits.
  # Available placeholders:
  #   <min_buy>        - minimum buy price
  #   <min_sell>       - minimum sell price
  #   <currency_buy>   - currency name for the buy amount
  #   <currency_sell>  - currency name for the sell amount
  #   <whole_numbers>  - "Yes" or "No"
  limits:
    <gold>Limits for chest shops:
    <yellow>Minimum buy (B) price: <min_buy> <currency_buy>
    <yellow>Minimum sell (S) price: <min_sell> <currency_sell>
    <yellow>Whole numbers only: <whole_numbers>
